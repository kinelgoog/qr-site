name: Test and publish QR site
on:
  push:
    branches: [main, 'upgrade/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qr-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check qr-worker.js
          node --check scripts/build.cjs
      - name: Assemble static site with local decoder
        run: npm run build
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npm test
      - name: Store test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: playwright-report/
      - name: Downloadable static site
        uses: actions/upload-artifact@v4
        with:
          name: tochka-qr-site
          path: dist/
          include-hidden-files: true
      - name: Package Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested site
        id: deployment
        uses: actions/deploy-pages@v4
