<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f5fb" id="themeColor">
  <meta name="description"
        content="Простой QR-сканер. Камера или изображение, без регистрации.">
  <title>Точка — QR-сканер</title>

  <script>
    (() => {
      let saved;
      try {
        saved = localStorage.getItem("qr-theme");
      } catch {}

      const theme = saved === "light" || saved === "dark"
        ? saved
        : matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";

      document.documentElement.dataset.theme = theme;
      document.getElementById("themeColor").content =
        theme === "dark" ? "#17131f" : "#f7f5fb";
    })();
  </script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5fb;
      --surface: #ffffff;
      --soft: #f0ecf7;
      --text: #292236;
      --muted: #6c617b;
      --border: #e4ddec;
      --accent: #6941ba;
      --accent-hover: #58349f;
      --on-accent: #ffffff;
      --focus: #855bd0;
      --error: #a22b48;
      --shadow: 0 12px 40px rgb(49 27 80 / 5%);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #17131f;
      --surface: #211b2b;
      --soft: #2b2338;
      --text: #f3edf9;
      --muted: #b8acc8;
      --border: #3b304b;
      --accent: #c4a5f5;
      --accent-hover: #d5bdf9;
      --on-accent: #231334;
      --focus: #c4a5f5;
      --error: #ffacbe;
      --shadow: 0 12px 40px rgb(0 0 0 / 10%);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html {
      min-width: 280px;
      background: var(--bg);
      accent-color: var(--accent);
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
    }

    button, select, textarea { font: inherit; }

    button, a, select {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button { cursor: pointer; }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    button, .button-link {
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 17px;
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: background-color .15s, border-color .15s;
    }

    .primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--on-accent);
    }

    @media (hover: hover) {
      button:not(:disabled):hover,
      .button-link:hover {
        background: var(--soft);
      }

      .primary:not(:disabled):hover {
        background: var(--accent-hover);
      }
    }

    .page {
      width: min(100% - 40px, 600px);
      margin-inline: auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-block: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: var(--accent);
    }

    .theme-button {
      min-height: 44px;
      padding: 8px 12px;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
    }

    main { padding-block: 27px 12px; }

    .intro { margin-bottom: 27px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(27px, 5vw, 36px);
      letter-spacing: -1.1px;
      line-height: 1.2;
    }

    .intro p {
      max-width: 440px;
      margin: 0;
      color: var(--muted);
    }

    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .preview {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--soft);
    }

    .preview.live { background: #100d15; }

    video {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: contain;
    }

    .placeholder {
      display: grid;
      justify-items: center;
      gap: 19px;
      padding: 20px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .placeholder p {
      max-width: 240px;
      margin: 0;
    }

    .scan-symbol {
      width: 66px;
      height: 66px;
      color: var(--accent);
    }

    .camera-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      border-radius: 8px;
      padding: 5px 9px;
      background: rgb(16 13 21 / 80%);
      color: #fff;
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .camera-tools {
      display: grid;
      gap: 7px;
      margin-top: 16px;
    }

    .camera-tools label {
      color: var(--muted);
      font-size: 13px;
    }

    select {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }

    .status {
      min-height: 44px;
      margin: 15px 2px 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .status[data-error="true"] { color: var(--error); }

    .result { margin-top: 16px; }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.4px;
    }

    .tag {
      border-radius: 7px;
      padding: 4px 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 100px;
      max-height: 340px;
      resize: vertical;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .result-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .copy-status {
      margin: 10px 0 0;
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      padding: 22px 0 max(28px, env(safe-area-inset-bottom));
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    footer p { margin: 0; }

    noscript p {
      padding: 16px;
      color: var(--error);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    @media (max-width: 380px) {
      .page { width: calc(100% - 28px); }
      .card { padding: 14px; }
      .actions { grid-template-columns: 1fr; }
      header { padding-block: 20px; }
      main { padding-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Точка
      </div>
      <button id="themeButton" class="theme-button" type="button">
        Сменить тему
      </button>
    </header>

    <main>
      <div class="intro">
        <h1>Сканировать QR-код</h1>
        <p>Наведи камеру или выбери изображение.
           Всё остальное мы сделаем здесь.</p>
      </div>

      <noscript>
        <p>Для распознавания QR-кодов нужно включить JavaScript
           в настройках браузера.</p>
      </noscript>

      <section class="card" aria-label="Сканер QR-кодов">
        <div class="preview" id="preview" aria-busy="false">
          <video id="video" autoplay muted playsinline hidden
                 aria-label="Изображение с камеры"></video>

          <div class="placeholder" id="placeholder">
            <svg class="scan-symbol" viewBox="0 0 64 64"
                 fill="none" aria-hidden="true">
              <path d="M21 7H11a4 4 0 0 0-4 4v10
                       M43 7h10a4 4 0 0 1 4 4v10
                       M57 43v10a4 4 0 0 1-4 4H43
                       M21 57H11a4 4 0 0 1-4-4V43"
                    stroke="currentColor" stroke-width="3"
                    stroke-linecap="round"/>
              <rect x="18" y="18" width="10" height="10" rx="2"
                    stroke="currentColor" stroke-width="3"/>
              <rect x="36" y="18" width="10" height="10" rx="2"
                    stroke="currentColor" stroke-width="3"/>
              <rect x="18" y="36" width="10" height="10" rx="2"
                    stroke="currentColor" stroke-width="3"/>
              <path d="M36 36h5v5h5v5H36V36Z"
                    fill="currentColor"/>
            </svg>
            <p id="placeholderText">
              Камера включится только с твоего разрешения
            </p>
          </div>

          <span id="cameraBadge" class="camera-badge" hidden>
            Камера включена
          </span>
        </div>

        <div class="camera-tools" id="cameraTools" hidden>
          <label for="cameraSelect">Камера</label>
          <select id="cameraSelect"></select>
        </div>

        <div class="actions">
          <button id="startButton" class="primary" type="button">
            Включить камеру
          </button>
          <button id="stopButton" type="button" hidden>
            Остановить
          </button>
          <button id="uploadButton" type="button">
            Загрузить фото
          </button>
        </div>

        <input id="fileInput" type="file"
               accept="image/*,.heic,.heif" hidden>

        <p id="status" class="status" role="status"
           aria-live="polite" aria-atomic="true">
          Фото и видео обрабатываются на твоём устройстве.
        </p>
      </section>

      <section id="result" class="card result"
               aria-labelledby="resultTitle" hidden>
        <div class="result-heading">
          <h2 id="resultTitle">Готово</h2>
          <span id="resultType" class="tag">Текст</span>
        </div>

        <textarea id="resultText" readonly rows="4"
                  aria-label="Содержимое QR-кода"
                  spellcheck="false"></textarea>

        <p id="resultNote" class="result-note"></p>

        <div class="actions">
          <button id="copyButton" class="primary" type="button">
            Скопировать
          </button>
          <a id="openLink" class="button-link" target="_blank"
             rel="noopener noreferrer" referrerpolicy="no-referrer"
             hidden>
            Открыть ссылку
          </a>
        </div>

        <p id="copyStatus" class="copy-status" role="status"
           aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <p>Без регистрации и истории сканирований.</p>
    </footer>
  </div>

  <script src="./jsQR.js"></script>
  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    const video = $("video");
    const preview = $("preview");
    const placeholder = $("placeholder");
    const placeholderText = $("placeholderText");
    const statusText = $("status");
    const startButton = $("startButton");
    const stopButton = $("stopButton");
    const uploadButton = $("uploadButton");
    const fileInput = $("fileInput");
    const cameraTools = $("cameraTools");
    const cameraSelect = $("cameraSelect");
    const result = $("result");
    const resultText = $("resultText");
    const openLink = $("openLink");
    const copyButton = $("copyButton");

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d", {
      willReadFrequently: true
    });

    const available =
      typeof window.jsQR === "function" && Boolean(context);

    let stream = null;
    let generation = 0;
    let timer = null;
    let state = "idle";
    let resultVersion = 0;

    // Theme: follow the system until a manual choice is saved.
    const systemTheme = matchMedia("(prefers-color-scheme: dark)");
    let manualTheme = false;

    try {
      manualTheme = ["light", "dark"].includes(
        localStorage.getItem("qr-theme")
      );
    } catch {}

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      $("themeColor").content =
        theme === "dark" ? "#17131f" : "#f7f5fb";

      $("themeButton").textContent =
        theme === "dark" ? "Светлая тема" : "Тёмная тема";

      $("themeButton").setAttribute(
        "aria-label",
        theme === "dark"
          ? "Включить светлую тему"
          : "Включить тёмную тему"
      );
    }

    applyTheme(document.documentElement.dataset.theme);

    $("themeButton").addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark"
        ? "light"
        : "dark";

      manualTheme = true;
      applyTheme(next);

      try {
        localStorage.setItem("qr-theme", next);
      } catch {}
    });

    function onSystemThemeChange(event) {
      if (!manualTheme) {
        applyTheme(event.matches ? "dark" : "light");
      }
    }

    if (systemTheme.addEventListener) {
      systemTheme.addEventListener("change", onSystemThemeChange);
    } else if (systemTheme.addListener) {
      systemTheme.addListener(onSystemThemeChange);
    }

    function announce(message, error = false) {
      statusText.textContent = message;
      statusText.dataset.error = String(error);
    }

    function setState(next) {
      state = next;
      const cameraActive = next === "requesting" || next === "scanning";

      startButton.hidden = cameraActive;
      stopButton.hidden = !cameraActive;
      stopButton.textContent =
        next === "requesting" ? "Отменить" : "Остановить";

      startButton.disabled = !available || next === "image";
      uploadButton.disabled =
        !available || next === "image" || next === "requesting";

      uploadButton.textContent =
        next === "image" ? "Распознаём…" : "Загрузить фото";

      preview.setAttribute(
        "aria-busy",
        String(next === "requesting" || next === "image")
      );
    }

    function stopAll() {
      generation += 1;
      clearTimeout(timer);
      timer = null;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.pause();
      video.srcObject = null;
      video.hidden = true;
      preview.classList.remove("live");
      placeholder.hidden = false;
      placeholderText.textContent =
        "Камера включится только с твоего разрешения";

      $("cameraBadge").hidden = true;
      cameraTools.hidden = true;

      // Release the last frame.
      canvas.width = 1;
      canvas.height = 1;
      setState("idle");
    }

    function clearResult() {
      resultVersion += 1;
      result.hidden = true;
      resultText.value = "";
      openLink.hidden = true;
      openLink.removeAttribute("href");
      $("copyStatus").textContent = "";
      copyButton.disabled = false;
    }

    function showResult(text) {
      stopAll();
      resultVersion += 1;
      resultText.value = text;
      result.hidden = false;
      $("copyStatus").textContent = "";
      copyButton.disabled = text.length === 0;

      let url = null;
      const trimmed = text.trim();

      // Never turn arbitrary QR contents into HTML or executable links.
      if (/^https?:\/\//i.test(trimmed)) {
        try {
          const parsed = new URL(trimmed);
          if (
            ["https:", "http:"].includes(parsed.protocol) &&
            !parsed.username &&
            !parsed.password
          ) {
            url = parsed;
          }
        } catch {}
      }

      openLink.hidden = !url;
      openLink.removeAttribute("href");

      if (url) {
        $("resultType").textContent = "Ссылка";
        openLink.href = url.href;
        $("resultNote").textContent =
          `Адрес: ${url.hostname}. Проверь его перед открытием. ` +
          "QR-код не гарантирует безопасность сайта.";
      } else {
        $("resultType").textContent = text ? "Текст" : "Пустой код";
        $("resultNote").textContent = text
          ? "Содержимое показано без изменений. Ничего не запускается автоматически."
          : "QR-код распознан, но текстовых данных в нём нет.";
      }

      placeholderText.textContent = "Готово. Можно сканировать следующий код";
      announce("QR-код распознан. Результат находится ниже.");
      resultText.focus();
    }

    function cameraError(error) {
      switch (error && error.name) {
        case "NotAllowedError":
        case "PermissionDeniedError":
          return "Нет доступа к камере. Разреши его в настройках сайта " +
                 "в браузере или загрузи изображение.";
        case "NotFoundError":
        case "DevicesNotFoundError":
          return "Камера не найдена. Можно загрузить изображение.";
        case "NotReadableError":
        case "TrackStartError":
          return "Камера недоступна. Возможно, её использует другое " +
                 "приложение. Закрой его и попробуй снова.";
        case "OverconstrainedError":
          return "Эта камера недоступна. Попробуй включить камеру снова.";
        case "SecurityError":
          return "Браузер запретил доступ к камере. Открой сайт " +
                 "по HTTPS в Safari, Chrome или другом обычном браузере.";
        default:
          return "Не удалось запустить камеру. Попробуй снова " +
                 "или загрузи изображение.";
      }
    }

    async function updateCameraList(token) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        if (token !== generation || !stream) return;

        const cameras = devices.filter(
          device => device.kind === "videoinput"
        );

        cameraSelect.replaceChildren();

        cameras.forEach((camera, index) => {
          const option = document.createElement("option");
          option.value = camera.deviceId;
          option.textContent = camera.label || `Камера ${index + 1}`;
          cameraSelect.append(option);
        });

        const activeId =
          stream.getVideoTracks()[0]?.getSettings().deviceId;

        if (activeId) cameraSelect.value = activeId;
        cameraTools.hidden = cameras.length < 2;
      } catch {
        // Scanning can continue even if device enumeration is unavailable.
        cameraTools.hidden = true;
      }
    }

    function decode(source, width, height, maxSide) {
      const ratio = Math.min(1, maxSide / Math.max(width, height));
      canvas.width = Math.max(1, Math.round(width * ratio));
      canvas.height = Math.max(1, Math.round(height * ratio));

      // Treat transparent image backgrounds as white.
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(source, 0, 0, canvas.width, canvas.height);

      const image = context.getImageData(
        0, 0, canvas.width, canvas.height
      );

      return window.jsQR(image.data, image.width, image.height, {
        inversionAttempts: "attemptBoth"
      });
    }

    function scanFrame(token) {
      if (token !== generation || state !== "scanning") return;

      try {
        if (video.readyState >= 2 && video.videoWidth > 0) {
          const code = decode(
            video, video.videoWidth, video.videoHeight, 960
          );

          if (code) {
            showResult(code.data);
            return;
          }
        }
      } catch {
        stopAll();
        announce(
          "Не удалось обработать кадр. Включи камеру заново " +
          "или загрузи изображение.",
          true
        );
        return;
      }

      // A modest scan rate limits battery and CPU use.
      timer = setTimeout(() => scanFrame(token), 220);
    }

    async function startCamera(deviceId) {
      stopAll();
      clearResult();

      if (!available) {
        announce("Не загружена библиотека распознавания jsQR.js.", true);
        return;
      }

      if (!window.isSecureContext) {
        announce(
          "Для камеры нужен HTTPS. Открой опубликованный сайт " +
          "GitHub Pages или загрузи изображение.",
          true
        );
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        announce(
          "Этот браузер не предоставляет доступ к камере. " +
          "Открой сайт в Safari или Chrome, либо загрузи фото.",
          true
        );
        return;
      }

      const token = generation;
      setState("requesting");
      placeholderText.textContent = "Ожидаем доступ к камере";
      announce("Разреши доступ к камере в запросе браузера.");

      try {
        const acquired = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            ...(deviceId
              ? { deviceId: { exact: deviceId } }
              : { facingMode: { ideal: "environment" } }),
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        // Permission may be granted after cancellation or navigation.
        if (token !== generation) {
          acquired.getTracks().forEach(track => track.stop());
          return;
        }

        stream = acquired;
        const track = stream.getVideoTracks()[0];

        track.addEventListener("ended", () => {
          if (token !== generation) return;
          stopAll();
          announce(
            "Камера отключилась. Нажми «Включить камеру», " +
            "чтобы продолжить."
          );
        }, { once: true });

        video.srcObject = stream;
        video.hidden = false;
        video.muted = true;
        await video.play();

        if (token !== generation) return;

        placeholder.hidden = true;
        preview.classList.add("live");
        $("cameraBadge").hidden = false;
        setState("scanning");

        announce(
          "Помести QR-код целиком в кадр. Держи камеру ровно " +
          "и избегай бликов."
        );

        void updateCameraList(token);
        scanFrame(token);
      } catch (error) {
        if (token !== generation) return;
        stopAll();
        announce(cameraError(error), true);
      }
    }

    startButton.addEventListener("click", () => {
      void startCamera();
    });

    stopButton.addEventListener("click", () => {
      stopAll();
      announce("Камера выключена.");
      startButton.focus();
    });

    cameraSelect.addEventListener("change", () => {
      void startCamera(cameraSelect.value);
    });

    uploadButton.addEventListener("click", () => {
      // Allows choosing the same file again.
      fileInput.value = "";
      fileInput.click();
    });

    const waitForPaint = () =>
      new Promise(resolve => setTimeout(resolve, 35));

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        const timeout = setTimeout(() => {
          image.onload = null;
          image.onerror = null;
          image.src = "";
          reject(new Error("IMAGE_TIMEOUT"));
        }, 20000);

        image.onload = () => {
          clearTimeout(timeout);
          resolve(image);
        };

        image.onerror = () => {
          clearTimeout(timeout);
          reject(new Error("IMAGE_FORMAT"));
        };

        image.src = url;
      });
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;

      stopAll();
      clearResult();

      if (!available) {
        announce("Не загружена библиотека распознавания jsQR.js.", true);
        return;
      }

      if (file.size > 24 * 1024 * 1024) {
        announce(
          "Изображение слишком большое. Выбери файл до 24 МБ " +
          "или сделай скриншот QR-кода.",
          true
        );
        return;
      }

      const token = generation;
      setState("image");
      placeholderText.textContent = "Ищем QR-код на изображении";
      announce("Обрабатываем изображение на твоём устройстве.");

      let objectUrl;
      let image;

      try {
        objectUrl = URL.createObjectURL(file);
        image = await loadImage(objectUrl);
        if (token !== generation) return;

        const width = image.naturalWidth;
        const height = image.naturalHeight;

        if (!width || !height) throw new Error("IMAGE_FORMAT");

        if (width * height > 40000000) {
          throw new Error("IMAGE_SIZE");
        }

        let code = null;
        let previousSide = 0;
        const originalSide = Math.max(width, height);

        // Try several resolutions instead of allocating a full-size canvas.
        for (const limit of [900, 1600, 2400]) {
          const side = Math.min(limit, originalSide);
          if (side === previousSide) continue;
          previousSide = side;

          await waitForPaint();
          if (token !== generation) return;

          code = decode(image, width, height, side);
          if (code) break;
        }

        if (token !== generation) return;

        if (code) {
          showResult(code.data);
        } else {
          stopAll();
          announce(
            "QR-код не найден. Обрежь изображение ближе к коду, " +
            "сохрани все четыре угла и светлое поле вокруг него.",
            true
          );
        }
      } catch (error) {
        if (token !== generation) return;
        stopAll();

        announce(
          error.message === "IMAGE_SIZE"
            ? "У изображения слишком высокое разрешение. " +
              "Уменьши его или загрузи скриншот."
            : "Не удалось прочитать изображение. Попробуй PNG, JPEG " +
              "или WebP. Поддержка HEIC зависит от браузера.",
          true
        );
      } finally {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        if (image) image.src = "";
        fileInput.value = "";
      }
    });

    copyButton.addEventListener("click", async () => {
      const text = resultText.value;
      const version = resultVersion;
      let copied = false;
      copyButton.disabled = true;

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch {}

      if (version !== resultVersion) return;

      if (!copied) {
        resultText.focus();
        resultText.select();
        resultText.setSelectionRange(0, text.length);

        try {
          copied = document.execCommand("copy");
        } catch {}
      }

      $("copyStatus").textContent = copied
        ? "Скопировано."
        : "Не удалось скопировать автоматически. " +
          "Текст выделен: выбери «Копировать» в меню устройства.";

      copyButton.disabled = !text;
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && state !== "idle") {
        const wasImage = state === "image";
        stopAll();
        announce(
          wasImage
            ? "Обработка прервана. Выбери изображение ещё раз."
            : "Камера выключена, пока вкладка неактивна. " +
              "Включи её снова, чтобы продолжить."
        );
      }
    });

    window.addEventListener("pagehide", stopAll);

    setState("idle");

    if (!available) {
      announce(
        "Не удалось загрузить распознавание. Убедись, что файл " +
        "jsQR.js находится рядом с index.html, и обнови страницу.",
        true
      );
    }
  </script>
</body>
</html>
