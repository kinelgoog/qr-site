<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f3ef" id="themeColor">
<meta name="description" content="QR-сканер в браузере. Всё остаётся на устройстве.">
<title>Точка · QR-сканер</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23101010'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f4f3ef'/%3E%3C/svg%3E">
<script>
(()=>{let saved;try{saved=localStorage.getItem('qr-theme')}catch{}const theme=['dark','light'].includes(saved)?saved:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;const meta=document.getElementById('themeColor');if(meta)meta.content=theme==='dark'?'#101010':'#f4f3ef'})();
</script>
<link rel="stylesheet" href="./styles.css?v=7">
<script src="./app.js?v=5" defer></script>
</head>
<body data-state="idle">
<div class="page">
<header class="site-header">
<a class="brand" href="./" aria-label="Точка, на главную"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Точка</span></a>
<button id="themeButton" class="theme-button" type="button">Сменить тему</button>
</header>
<main class="layout">
<h1 class="sr-only">Точка, QR-сканер</h1>
<section class="card scanner-card" aria-label="Сканер QR-кодов">
<div class="preview" id="preview" aria-busy="false">
<video id="video" autoplay muted playsinline hidden aria-label="Изображение с камеры"></video>
<div class="viewfinder" aria-hidden="true">
<span class="vf-corner vf-corner--tl"></span>
<span class="vf-corner vf-corner--tr"></span>
<span class="vf-corner vf-corner--bl"></span>
<span class="vf-corner vf-corner--br"></span>
<span class="scan-line"></span>
</div>
<div class="placeholder" id="placeholder">
<div class="ph-visual" aria-hidden="true">
<svg class="scan-symbol" viewBox="0 0 48 48" fill="none"><rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2.5"/><rect x="27" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2.5"/><rect x="13" y="27" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2.5"/><path d="M27 27h4v4h4v4h-8v-8Z" fill="currentColor"/></svg>
<span class="loader"></span>
<svg class="done-mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle class="dm-circle" cx="32" cy="32" r="28"/><path class="dm-check" d="m21 33 7 7 15-16"/></svg>
</div>
<p id="placeholderText"></p>
</div>
<span id="cameraBadge" class="camera-badge" hidden>Ищем QR-код</span>
</div>
<div id="cameraTools" class="camera-tools" hidden>
<div id="cameraChoice">
<label for="cameraSelect" class="sr-only">Камера</label>
<span class="select-wrap"><select id="cameraSelect"></select></span>
</div>
<button id="torchButton" class="btn btn--ghost" type="button" aria-pressed="false" hidden>Фонарик</button>
</div>
<div class="actions">
<button id="startButton" class="btn primary" type="button">Сканировать</button>
<button id="stopButton" class="btn btn--soft" type="button" hidden>Остановить</button>
<button id="uploadButton" class="btn btn--ghost" type="button">Загрузить фото</button>
</div>
<input id="fileInput" type="file" accept="image/*,.heic,.heif" hidden>
<p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
</section>
<section id="result" class="card result" aria-labelledby="resultTitle" hidden>
<div class="result-heading">
<span class="result-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4 8-9"/></svg></span>
<h2 id="resultTitle">Готово</h2>
<span id="resultType" class="tag">Текст</span>
</div>
<textarea id="resultText" readonly rows="3" spellcheck="false" aria-label="Содержимое QR-кода"></textarea>
<p id="resultNote" class="result-note"></p>
<div class="actions actions--result">
<button id="copyButton" class="btn primary" type="button">Скопировать</button>
<a id="openLink" class="btn btn--ghost button-link" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" hidden>Открыть</a>
</div>
<p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>
</section>
<noscript><p class="noscript-note">Нужен JavaScript.</p></noscript>
</main>
<footer class="site-footer"><span>Всё остаётся на устройстве</span><span class="version">3.2</span></footer>
</div>
<div class="drop-zone" aria-hidden="true"><div class="drop-inner"><span class="drop-icon"></span><p>Отпусти фото</p></div></div>
<script>
(()=>{
  const body = document.body;
  const byId = id => document.getElementById(id);
  let depth = 0;
  const hasFiles = e => !!e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0;
  const isImage = f => !!f && (/^image\//.test(f.type || '') || /\.(heic|heif)$/i.test(f.name || ''));
  function feed(file) {
    const input = byId('fileInput'), upload = byId('uploadButton');
    if (!isImage(file) || !input || !upload || upload.disabled) return false;
    try {
      const transfer = new DataTransfer();
      transfer.items.add(file);
      if (body.dataset.state === 'scanning') byId('stopButton').click();
      input.files = transfer.files;
      input.dispatchEvent(new Event('change', {bubbles: true}));
      return true;
    } catch { return false; }
  }
  addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; body.classList.add('is-dragging'); });
  addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) body.classList.remove('is-dragging'); });
  addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; body.classList.remove('is-dragging'); feed(e.dataTransfer.files[0]); });
  addEventListener('paste', e => {
    const target = e.target;
    if (target && (target.tagName === 'INPUT' || (target.tagName === 'TEXTAREA' && !target.readOnly))) return;
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (const item of items) {
      if (item.kind === 'file' && feed(item.getAsFile())) { e.preventDefault(); break; }
    }
  });
})();
</script>
</body>
</html>
